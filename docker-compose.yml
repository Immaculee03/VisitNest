version: "3.9"

# ─────────────────────────────────────────────
# VisitNest – Docker Compose Configuration
# Services: frontend | backend | database
# ─────────────────────────────────────────────

services:

  # ── Frontend: React Web Application ─────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visitnest_frontend
    ports:
      - "3000:3000"       # Host port 3000 → Container port 3000
    depends_on:
      - backend           # Frontend waits for backend to start
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - visitnest_network

  # ── Backend: Node.js / Express API ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visitnest_backend
    ports:
      - "5000:5000"       # Host port 5000 → Container port 5000
    depends_on:
      - database          # Backend waits for database to start
    env_file:
      - .env              # Load environment variables from .env file
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=visit_nest_db
    networks:
      - visitnest_network
    restart: unless-stopped

  # ── Database: MySQL ──────────────────────────
  database:
    image: mysql:8.0
    container_name: visitnest_db
    ports:
      - "3306:3306"       # Host port 3306 → Container port 3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: visit_nest_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - visitnest_db:/var/lib/mysql        # Named volume — data persists across restarts
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # Auto-run on first start
    networks:
      - visitnest_network
    restart: unless-stopped

# ── Named Volumes ────────────────────────────
volumes:
  visitnest_db:
    driver: local          # Stores MySQL data on the host machine permanently

# ── Networks ─────────────────────────────────
networks:
  visitnest_network:
    driver: bridge         # All three services communicate on this private network
